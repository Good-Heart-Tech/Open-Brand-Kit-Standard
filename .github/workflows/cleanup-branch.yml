# One-off: deletes a merged branch, then this file is removed.
name: cleanup-branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/claude/obks-release-zips" || true
