# To release: bump the version everywhere (package.json and the three packages) and push to main.
#   - "assets" (runs on every push to main): if no release exists yet for v<version>, it creates
#     the tag and GitHub release and attaches the starter kit zip and SHA256SUMS.txt, so people
#     without a GitHub account can download them. If the release exists, it does nothing.
#     Pushing a v* tag by hand or publishing a release in the GitHub UI also works.
#     No secrets needed.
#   - "publish" (runs only when a release is published by a person in the GitHub UI):
#     publishes the three packages to npm.
# One-time setup for npm:
#   1. Create the free "goodheart" organization on npmjs.com (public packages are free).
#   2. Add an npm automation token as the repository secret NPM_TOKEN.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            test "$tag" = "v$version" || { echo "::error::Tag $tag does not match package.json version $version"; exit 1; }
          else
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.skip != 'true'
        run: npm ci
      - if: steps.tag.outputs.skip != 'true'
        run: node scripts/build-release-zips.js
      - name: Create the release if needed
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.tag.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes --title "${{ steps.tag.outputs.tag }}"
      - name: Attach zips to the release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/release/* --clobber

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      # Order matters: the CLI depends on the schema and rules packages.
      - run: npm publish --workspace packages/obks-schema --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace packages/obks-rules-ght --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace packages/obks-cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
