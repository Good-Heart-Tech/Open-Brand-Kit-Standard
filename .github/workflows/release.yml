# To release: bump the version everywhere (package.json and the three packages) and push to main.
#   - "assets": if no release exists yet for v<version>, creates the tag and GitHub release,
#     attaches the starter kit zip and SHA256SUMS.txt (so people without a GitHub account can
#     download them), and moves the floating major tag (for example v1) to this release.
#     If the release already exists, it does nothing. Pushing a v* tag by hand also works.
#   - "publish": after a new release, publishes the three packages to npm, but only when the
#     NPM_TOKEN secret exists. Packages already on npm at this version are skipped.
#     Run it by hand from the Actions tab (workflow_dispatch) after adding the token.
# One-time setup for npm:
#   1. Create the free "goodheart" organization on npmjs.com (public packages are free).
#   2. Create an npm automation (granular, publish) token and add it as the repository secret NPM_TOKEN.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  assets:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            test "$tag" = "v$version" || { echo "::error::Tag $tag does not match package.json version $version"; exit 1; }
          else
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then echo "Release $tag already exists; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "major=v${version%%.*}" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.skip != 'true'
        run: npm ci
      - if: steps.tag.outputs.skip != 'true'
        run: npm test
      - if: steps.tag.outputs.skip != 'true'
        run: npm run validate
      - if: steps.tag.outputs.skip != 'true'
        run: node scripts/build-release-zips.js
      - name: Create the release if needed
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1 || gh release create "${{ steps.tag.outputs.tag }}" --target "$GITHUB_SHA" --generate-notes --title "${{ steps.tag.outputs.tag }}"
      - name: Attach zips to the release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/release/* --clobber
      - name: Move the floating major tag (for example v1)
        if: steps.tag.outputs.skip != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f "${{ steps.tag.outputs.major }}" "$GITHUB_SHA"
          git push -f origin "refs/tags/${{ steps.tag.outputs.major }}"

  publish:
    needs: assets
    if: always() && (github.event_name == 'workflow_dispatch' || needs.assets.outputs.created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Say if npm is not set up
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::warning::NPM_TOKEN is not set, so nothing was published to npm. Add the secret, then run this workflow by hand."
      - uses: actions/checkout@v4
        if: env.HAS_NPM_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm ci
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm test
      - if: env.HAS_NPM_TOKEN == 'true'
        run: npm run validate
      # Order matters: the CLI depends on the schema and rules packages.
      - name: Publish packages that are not on npm yet
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in obks-schema obks-rules-ght obks-cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping."
            else
              npm publish --workspace "packages/$pkg" --provenance --access public
            fi
          done
