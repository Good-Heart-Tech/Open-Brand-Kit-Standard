# Reusable GitHub Action: validate a OBKS brand kit in any repository.
#
#   - uses: actions/checkout@v4
#   - uses: Good-Heart-Tech/Open-Brand-Kit-Standard@v1
#     with:
#       path: .
#
# Product kits: check out the parent kit first (actions/checkout with `path:`), then set parent-path.
name: OBKS validate
description: Validate a Open Brand Kit Standard (OBKS) and check that generated exports are committed.
author: Good Heart Tech
branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: Folder containing brandkit.yaml
    default: "."
  strict:
    description: Treat suggestions as failures ("true" or "false"). Off by default so a partly finished kit still passes.
    default: "false"
  parent-path:
    description: Local path to a checkout of the parent kit (product kits)
    default: ""
  check-exports:
    description: Regenerate exports and digest, then fail if they differ from what is committed
    default: "true"
  bundle:
    description: Also build a download-ready brand kit zip (needs publication.visibility partner or public) and upload it as a workflow artifact
    default: "false"
  bundle-version:
    description: Version for the zip file name, for example 1.2.0 or a tag like v1.2.0 (defaults to brand.version in brandkit.yaml)
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Install OBKS CLI
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund --omit=dev
    - name: Check generated files are current
      if: inputs.check-exports == 'true'
      shell: bash
      env:
        OBKS: ${{ github.action_path }}/packages/obks-cli/bin/obks.js
        KIT_PATH: ${{ inputs.path }}
      run: |
        node "$OBKS" export "$KIT_PATH" --all
        node "$OBKS" digest "$KIT_PATH"
        if ! git diff --exit-code -- "$KIT_PATH"; then
          echo "::error::Generated files are out of date. Run 'obks export --all' and 'obks digest', then commit."
          exit 1
        fi
    - name: Validate
      shell: bash
      env:
        OBKS: ${{ github.action_path }}/packages/obks-cli/bin/obks.js
        KIT_PATH: ${{ inputs.path }}
        STRICT: ${{ inputs.strict }}
        PARENT_PATH: ${{ inputs.parent-path }}
      run: |
        args=(validate "$KIT_PATH")
        if [ "$STRICT" = "true" ]; then args+=(--strict); fi
        if [ -n "$PARENT_PATH" ]; then args+=(--parent "$PARENT_PATH"); fi
        node "$OBKS" "${args[@]}"
    - name: Build brand kit zip
      if: inputs.bundle == 'true'
      shell: bash
      env:
        OBKS: ${{ github.action_path }}/packages/obks-cli/bin/obks.js
        KIT_PATH: ${{ inputs.path }}
        BUNDLE_VERSION: ${{ inputs.bundle-version }}
      run: |
        args=(publish "$KIT_PATH" --zip)
        if [ -n "$BUNDLE_VERSION" ]; then args+=(--kit-version "$BUNDLE_VERSION"); fi
        node "$OBKS" "${args[@]}"
    - name: Upload brand kit zip
      if: inputs.bundle == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: brand-kit-zip
        path: |
          ${{ inputs.path }}/dist/*.zip
          ${{ inputs.path }}/dist/SHA256SUMS.txt
