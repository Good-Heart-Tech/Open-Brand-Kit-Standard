# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/Good-Heart-Tech/Open-Brand-Kit-Standard@main/packages/obks-schema/schemas/brandkit.schema.json
# For-profit business example (fictional company) with a public press kit.
schema: obks/v1
specVersion: 1.0.0
brand:
  id: ridgeline-coffee
  displayName: Ridgeline Coffee Roasters
  maturity: standard
role: organization
organization:
  type: company
  industry: specialty coffee (roasting, cafes, online shop, and wholesale)
  founded: 2014
  website: https://ridgelinecoffee.example
profiles:
  core: true
  identity: true
  voice: true
  visual: true
  copy: true
  tokens: true
  security: true
consumption:
  cssVariables: tokens/exports/css/variables.css
  agentDigest: digest/AGENT_CONTEXT.md
  tailwindTheme: tokens/exports/tailwind/theme.cjs
# Public press kit: logos, colors, and press boilerplate only.
# Pricing, wholesale terms, and product copy (copy/messaging.md) stay private on purpose.
publication:
  visibility: public
  includedPaths:
    - assets/logo/
    - tokens/exports/html/brand-at-a-glance.html
    - tokens/exports/css/variables.css
    - visual/logo.md
    - copy/press-kit.md
validation:
  rulesPack: "@goodheart/obks-rules-ght"
  minContrastRatio: 4.5
  contrastPairs:
    - foreground: palette.body
      background: palette.surface
      use: body text
    - foreground: palette.ink
      background: palette.surface
      use: headings
    - foreground: palette.link
      background: palette.surface
      use: links
    - foreground: palette.onPrimary
      background: palette.copper
      use: white label on a copper button
    - foreground: palette.body
      background: palette.card
      use: text on a card
  avoidPairs:
    - foreground: palette.sage
      background: palette.surface
      reason: Sage is an illustration color and too light for text on crema
    - foreground: palette.white
      background: palette.sage
      reason: White labels on sage are too faint to read
    - foreground: palette.copper
      background: palette.ink
      reason: Copper on espresso looks muddy and fails contrast for small text
contacts:
  security: https://ridgelinecoffee.example/contact
