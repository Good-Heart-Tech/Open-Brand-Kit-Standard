# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/Good-Heart-Tech/Open-Brand-Kit-Standard@main/packages/obks-schema/schemas/brandkit.schema.json
# Public agency example (fictional county government). Accessibility is a legal
# requirement here, and the county seal is a protected mark kept out of the partner bundle.
schema: obks/v1
specVersion: 1.0.0
brand:
  id: brightwater-county
  displayName: Brightwater County
  maturity: standard
role: organization
organization:
  type: government
  industry: county government services
  location: Brightwater Valley
  serviceArea: Brightwater County (about 180,000 residents)
  website: https://brightwatercounty.example
profiles:
  core: true
  identity: true
  voice: true
  visual: true
  copy: true
  tokens: true
  security: true
consumption:
  cssVariables: tokens/exports/css/variables.css
  agentDigest: digest/AGENT_CONTEXT.md
  tailwindTheme: tokens/exports/tailwind/theme.cjs
# Partner sharing: partner agencies, vendors, and the press get the logo, colors,
# and logo rules. The county seal is NOT listed here, on purpose.
publication:
  visibility: partner
  includedPaths:
    - assets/logo/mark.svg
    - assets/logo/mark-reversed.svg
    - assets/logo/wordmark.svg
    - assets/logo/favicon.svg
    - tokens/exports/html/brand-at-a-glance.html
    - tokens/exports/css/variables.css
    - visual/logo.md
validation:
  rulesPack: "@goodheart/obks-rules-ght"
  minContrastRatio: 4.5
  contrastPairs:
    - foreground: palette.body
      background: palette.surface
      use: body text
    - foreground: palette.ink
      background: palette.surface
      use: headings
    - foreground: palette.link
      background: palette.surface
      use: links
    - foreground: palette.onPrimary
      background: palette.primary
      use: white label on a civic blue button
    - foreground: palette.body
      background: palette.subtle
      use: text on a card
    - foreground: palette.link
      background: palette.subtle
      use: links on a card
    - foreground: palette.onPrimary
      background: palette.success
      use: white text on a green success message
    - foreground: palette.onAlert
      background: palette.alert
      use: dark text on a gold alert banner
  avoidPairs:
    - foreground: palette.alert
      background: palette.surface
      reason: Gold text on white is unreadable; gold is a background for alert banners only
    - foreground: palette.onPrimary
      background: palette.alert
      reason: White text on gold fails contrast; alert banners always use onAlert (dark) text
    - foreground: palette.primary
      background: palette.ink
      reason: Civic blue on near-black is too dark to read
    - foreground: palette.success
      background: palette.surface
      reason: Green text alone should not signal success; use a green message box with an icon and words
contacts:
  security: https://brightwatercounty.example/report-fraud
