# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/Good-Heart-Tech/Open-Brand-Kit-Standard@main/packages/obks-schema/schemas/brandkit.schema.json
# The smallest useful OBKS kit: colors, logo, and brand protection. No rules pack.
schema: obks/v1
specVersion: 1.0.0
brand:
  id: minimal-brand
  displayName: Minimal Brand
  maturity: basic
role: organization
profiles:
  core: true
  visual: true
  tokens: true
  security: true
consumption:
  cssVariables: tokens/exports/css/variables.css
  agentDigest: digest/AGENT_CONTEXT.md
validation:
  contrastPairs:
    - foreground: palette.text
      background: palette.background
      use: all text
    - foreground: palette.background
      background: palette.primary
      use: button labels
  avoidPairs:
    - foreground: palette.primary
      background: palette.text
      reason: Red on near-black is hard to read
contacts:
  security: security@minimal.example
publication:
  visibility: private
