# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/Good-Heart-Tech/Open-Brand-Kit-Standard@main/packages/obks-schema/schemas/brandkit.schema.json
# Realistic nonprofit example (fictional organization) with a public press kit.
schema: obks/v1
specVersion: 1.0.0
brand:
  id: cedar-hollow-pantry
  displayName: Cedar Hollow Community Pantry
  maturity: standard
role: organization
organization:
  type: nonprofit
  industry: community food pantry
  founded: 2009
  website: https://cedarhollowpantry.example
profiles:
  core: true
  identity: true
  voice: true
  visual: true
  copy: true
  tokens: true
  security: true
consumption:
  cssVariables: tokens/exports/css/variables.css
  agentDigest: digest/AGENT_CONTEXT.md
  tailwindTheme: tokens/exports/tailwind/theme.cjs
# Public press kit: logos, colors, and press boilerplate only.
# Donation wording, staff contacts, and email templates stay private on purpose.
publication:
  visibility: public
  includedPaths:
    - assets/logo/
    - tokens/exports/html/brand-at-a-glance.html
    - tokens/exports/css/variables.css
    - visual/logo.md
    - copy/press-kit.md
validation:
  rulesPack: "@goodheart/obks-rules-ght"
  minContrastRatio: 4.5
  contrastPairs:
    - foreground: palette.body
      background: palette.surface
      use: body text
    - foreground: palette.ink
      background: palette.surface
      use: headings
    - foreground: palette.onPrimary
      background: palette.primary
      use: buttons and banners
    - foreground: palette.link
      background: palette.surface
      use: links
    - foreground: palette.ink
      background: palette.harvest
      use: large headings on harvest bands
      min: 3
  avoidPairs:
    - foreground: palette.harvest
      background: palette.surface
      reason: Harvest orange is too light for text on the page
    - foreground: palette.onPrimary
      background: palette.harvest
      reason: White labels on harvest are too faint
    - foreground: palette.primary
      background: palette.ink
      reason: Green on near-black is hard to read
contacts:
  security: https://cedarhollowpantry.example/contact
