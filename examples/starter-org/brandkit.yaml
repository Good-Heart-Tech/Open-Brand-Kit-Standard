# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/Good-Heart-Tech/Open-Brand-Kit-Standard@main/packages/obks-schema/schemas/brandkit.schema.json
# Reference organization kit (fictional). Every OBKS feature is used here, including organization context and word rules.
schema: obks/v1
specVersion: 1.0.0
brand:
  id: acme-labs
  displayName: Acme Labs
  maturity: advanced
role: organization
organization:
  type: company
  industry: workplace software for small and mid-sized businesses
  location: Denver, Colorado
  founded: 2017
  website: https://acme-labs.example
profiles:
  core: true
  identity: true
  voice: true
  visual: true
  copy: true
  tokens: true
  security: true
consumption:
  cssVariables: tokens/exports/css/variables.css
  agentDigest: digest/AGENT_CONTEXT.md
  tailwindTheme: tokens/exports/tailwind/theme.cjs
# Partner sharing: only these paths go into `obks publish` bundles for sponsors and partners.
publication:
  visibility: partner
  includedPaths:
    - assets/logo/
    - tokens/exports/css/variables.css
    - tokens/exports/dtcg/
    - tokens/exports/html/brand-at-a-glance.html
    - visual/logo.md
validation:
  rulesPack: "@goodheart/obks-rules-ght"
  minContrastRatio: 4.5
  contrastPairs:
    - foreground: palette.body
      background: palette.surface
      use: body text
    - foreground: palette.ink
      background: palette.surface
      use: headings
    - foreground: palette.onPrimary
      background: palette.primary
      use: button labels
    - foreground: palette.link
      background: palette.surface
      use: links
    - foreground: palette.ink
      background: palette.subtle
      use: text on callout panels
  avoidPairs:
    - foreground: palette.accent
      background: palette.surface
      reason: Too light to read as text
    - foreground: palette.onPrimary
      background: palette.accent
      reason: White labels disappear on accent
    - foreground: palette.primary
      background: palette.ink
      reason: Blue on near-black is hard to read
contacts:
  brand: brand@acme-labs.example
  legal: legal@acme-labs.example
  security: security@acme-labs.example
