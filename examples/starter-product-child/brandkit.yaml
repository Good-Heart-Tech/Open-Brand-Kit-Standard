# yaml-language-server: $schema=https://cdn.jsdelivr.net/gh/Good-Heart-Tech/Open-Brand-Kit-Standard@main/packages/obks-schema/schemas/brandkit.schema.json
# Reference product (child) kit. Colors marked inheritsFrom are checked against ../starter-org.
schema: obks/v1
specVersion: 1.0.0
brand:
  id: acme-docs
  displayName: Acme Docs
  maturity: standard
role: product
profiles:
  core: true
  identity: true
  voice: true
  visual: true
  copy: true
  tokens: true
  security: true
consumption:
  cssVariables: tokens/exports/css/variables.css
  agentDigest: digest/AGENT_CONTEXT.md
  tailwindTheme: tokens/exports/tailwind/theme.cjs
publication:
  visibility: private
  includedPaths: []
validation:
  rulesPack: "@goodheart/obks-rules-ght"
  minContrastRatio: 4.5
  contrastPairs:
    - foreground: palette.ink
      background: palette.surface
      use: headings and body text
    - foreground: palette.onPrimary
      background: palette.primary
      use: button labels
    - foreground: palette.link
      background: palette.surface
      use: links
  avoidPairs:
    - foreground: palette.productAccent
      background: palette.ink
      reason: Purple on near-black is hard to read
    - foreground: palette.productAccent
      background: palette.primary
      reason: Two brand colors fighting; never text on primary
contacts:
  brand: docs@acme-labs.example
  legal: legal@acme-labs.example
  security: security@acme-labs.example
hierarchy:
  parent:
    repository: https://github.com/Good-Heart-Tech/Open-Brand-Kit-Standard
    ref: main
    brandId: acme-labs
    path: ../starter-org
